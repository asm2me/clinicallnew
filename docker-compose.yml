##############################################################################
#  Clinic SaaS Platform - Docker Compose (100% Docker, zero host install)
#
#  Usage:
#    docker compose up -d          # Start everything
#    docker compose logs -f api    # Watch API logs
#    docker compose exec api sh    # Shell into API container
##############################################################################

services:

  # ── Laravel API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: clinic_api
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html                  # Live code reload
      - api_vendor:/var/www/html/vendor           # Persist vendor between restarts
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: clinic_central
      DB_USERNAME: clinic_user
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      CENTRAL_DOMAIN: localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clinic_net

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: clinic_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - clinic_net

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: clinic_frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app                          # Live code reload
      - frontend_node_modules:/app/node_modules  # Persist node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      - api
    networks:
      - clinic_net

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: clinic_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: clinic_central
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: secret
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - clinic_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_central"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: clinic_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - clinic_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Laravel Horizon (Queue Worker) ──────────────────────────────────────────
  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: clinic_horizon
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/html
      - api_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: clinic_central
      DB_USERNAME: clinic_user
      DB_PASSWORD: secret
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      api:
        condition: service_started
    networks:
      - clinic_net

  # ── Laravel Scheduler (Cron) ────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: clinic_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./backend:/var/www/html
      - api_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      CACHE_STORE: redis
      CACHE_DRIVER: redis
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: clinic_central
      DB_USERNAME: clinic_user
      DB_PASSWORD: secret
      REDIS_HOST: redis
    depends_on:
      api:
        condition: service_started
    networks:
      - clinic_net

  # ── MinIO (S3-compatible storage) ───────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: clinic_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - clinic_net

  # ── Mailhog (Dev email catcher) ─────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: clinic_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - clinic_net

  # ── pgAdmin (Database GUI - optional) ───────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: clinic_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@clinic.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      - postgres
    networks:
      - clinic_net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  api_vendor:                  # Composer vendor cache (not on host)
  frontend_node_modules:       # npm cache (not on host)

networks:
  clinic_net:
    driver: bridge
